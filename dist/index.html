    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              display: ['Space Grotesk', 'sans-serif'],
              mono: ['ui-monospace', 'SFMono-Regular', 'Menlo', 'Monaco', 'Consolas', "Liberation Mono", "Courier New", 'monospace'],
            },
            colors: {
              blueprint: {
                bg: '#FFFDF5', // Warm Cream / Paper
                panel: '#FFFFFF',
                border: '#E5E5E5', // Light gray for subtle borders
                grid: '#EFECE2', // Slightly darker cream for grid
                primary: '#000000', // Pure Black
                accent: '#333333', // Dark Gray
                text: '#1A1A1A', // Soft Black
                muted: '#666666', // Medium Gray
              }
            },
            animation: {
              'pulse-slow': 'pulse 6s cubic-bezier(0.4, 0, 0.6, 1) infinite',
              'draw': 'draw 2s ease-in-out forwards',
              'marquee': 'marquee 60s linear infinite',
              'marquee-reverse': 'marqueeReverse 60s linear infinite',
            },
            keyframes: {
              marquee: {
                '0%': { transform: 'translateX(0%)' },
                '100%': { transform: 'translateX(-50%)' },
              },
              marqueeReverse: {
                '0%': { transform: 'translateX(-50%)' },
                '100%': { transform: 'translateX(0%)' },
              },
              draw: {
                '0%': { strokeDasharray: '1000', strokeDashoffset: '1000' },
                '100%': { strokeDashoffset: '0' },
              }
            },
            backgroundImage: {
              'grid-pattern': "linear-gradient(to right, #EFECE2 1px, transparent 1px), linear-gradient(to bottom, #EFECE2 1px, transparent 1px)",
            }
          },
        },
      }
    </script>
