    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jagadeeswaran | Product Designer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Space+Grotesk:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
      :root {
        --bg-color: #FFFDF5;
        --panel-color: #FFFFFF;
        --border-color: #E5E5E5;
        --grid-color: #EFECE2;
        --primary-color: #000000;
        --text-color: #1A1A1A;
        --muted-color: #666666;
        --accent-color: #333333;
      }

      .dark {
        --bg-color: #050505;
        --panel-color: #111111;
        --border-color: #333333;
        --grid-color: #1A1A1A;
        --primary-color: #FFFFFF;
        --text-color: #EDEDED;
        --muted-color: #A0A0A0;
        --accent-color: #CCCCCC;
      }

      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      html { scroll-behavior: smooth; }
      body { background-color: var(--bg-color); color: var(--text-color); transition: background-color 0.3s, color 0.3s; }
      ::selection { background: var(--primary-color); color: var(--bg-color); }
      
      .paused {
        animation-play-state: paused !important;
      }
    </style>

    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              display: ['Space Grotesk', 'sans-serif'],
              mono: ['ui-monospace', 'SFMono-Regular', 'Menlo', 'Monaco', 'Consolas', "Liberation Mono", "Courier New", 'monospace'],
            },
            colors: {
              blueprint: {
               bg: 'var(--bg-color)', 
                panel: 'var(--panel-color)',
                border: 'var(--border-color)',
                grid: 'var(--grid-color)',
                primary: 'var(--primary-color)',
                accent: 'var(--accent-color)',
                text: 'var(--text-color)',
                muted: 'var(--muted-color)',
              }
            },
            animation: {
              'pulse-slow': 'pulse 6s cubic-bezier(0.4, 0, 0.6, 1) infinite',
              'draw': 'draw 2s ease-in-out forwards',
              'marquee': 'marquee 60s linear infinite',
              'marquee-reverse': 'marqueeReverse 60s linear infinite',
            },
            keyframes: {
              marquee: {
                '0%': { transform: 'translateX(0%)' },
                '100%': { transform: 'translateX(-50%)' },
              },
              marqueeReverse: {
                '0%': { transform: 'translateX(-50%)' },
                '100%': { transform: 'translateX(0%)' },
              },
              draw: {
                '0%': { strokeDasharray: '1000', strokeDashoffset: '1000' },
                '100%': { strokeDashoffset: '0' },
              }
            },
            backgroundImage: {
              'grid-pattern': "linear-gradient(to right, var(--grid-color) 1px, transparent 1px), linear-gradient(to bottom, var(--grid-color) 1px, transparent 1px)",
            }
          },
        },
      }
    </script>
